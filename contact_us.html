<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Hub</title>
</head>

<body>

    <!-- Main Page Container -->
    <div style="
        border: 1px solid;
        width: 95%;
        min-height: 620px;
        margin: 10px auto;
        padding: 10px;
    ">


        <!-- Header -->
        <header style="
            border: 1px solid;
            border-radius: 15px;
            width: 90%;
            height: 72px;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        ">

            <h1>
                Student Hub
            </h1>

        </header>


        <!-- Main Content -->
        <main style="
            display: flex;
            gap: 48px;
            margin: 15px 20px;
        ">
            <!-- Side Navigation Panel -->
            <nav style="
                border: 1px solid;
                border-radius: 17px;
                width: 100px;
                min-height: 360px;
                padding: 20px 0;
                text-align: center;
            ">


                <a href="profile.html">
                    Profile
                </a>

                <br><br><br>


                <a href="attendance.html">
                    Attendance
                </a>

                <br><br><br>


                <a href="event-details.html">
                    Event Details
                </a>

                <br><br><br>


                <a href="result.html">
                    Result
                </a>

                <br><br><br>


                <a href="timetable.html">
                    Timetable
                </a>

                <br><br><br>


                <a href="contact.html">
                    Contact Us
                </a>
                <br><br><br>


                <a href="fee.html">
                   Fee structure
                </a>

            </nav>


            <!-- Main Page Content -->
            <section>

                <!-- Home Button -->
                <button style="
                    width: 100px;
                    height: 50px;
                    border: 1px solid;
                    border-radius: 8px;
                ">

                    Contact Us

                </button>


                <!-- Photo / Main Content Box -->
                <!-- Contact Page -->

                <!-- Contact Us Button -->
             


                <!-- Contact Information -->
                <div style="
                    position: absolute;
                    top: 105px;
                    left: 0;
                    font-size: 20px;
                    line-height: 1.6;
                ">

                   
                </div>


                <!-- Contact Form -->
                <div style="
                    position: left;
                    top: 38px;
                    right: 30px;
                    border: 1px solid;
                    width: 420px;
                    padding: 20px;
                ">

                    <h2 style="
                        margin-top: 0;
                        font-size: 20px;
                        font-weight: normal;
                    ">
                        Send us message
                    </h2>


                    <form>

                        <!-- Email -->
                        <label for="email">
                            Your Email:
                        </label>

                        <br><br>

                        <input type="email" id="email" name="email" placeholder="Enter your email" required style="
                                width: 380px;
                                height: 30px;
                                padding: 5px;
                            ">


                        <br><br>


                        <!-- Full Name -->
                        <label for="fullname">
                            Full Name:
                        </label>

                        <br><br>

                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required
                            style="
                                width: 380px;
                                height: 30px;
                                padding: 5px;
                            ">


                        <br><br>


                        <!-- Message -->
                        <textarea id="message" name="message" placeholder="Your Message" required style="
                                width: 380px;
                                height: 100px;
                                padding: 10px;
                                resize: none;
                            "></textarea>


                        <br><br>


                        <!-- Submit -->
                        <button type="submit" style="
                                width: 100px;
                                height: 35px;
                                cursor: pointer;
                            ">
                            Send
                        </button>

                    </form>

                </div>




            </section>

        </main>

    </div>

</body>

</html>
